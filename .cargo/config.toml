# Cargo-integrated candle-graph trace tools (sibling crate):
#   cargo candle-graph summary runs/p2/example/profile/update-000000000002/application.jsonl
#   cargo p2-view runs/p2/example/profile/update-000000000002 --output viewer.html

[alias]
candle-graph = "run --manifest-path ../candle_graph/Cargo.toml --features all --bin cargo-candle-graph --"
p2-view = "run -- p2-view"
