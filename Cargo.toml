[package]
name = "tofy"
version = "0.1.0"
edition = "2021"
description = "Recursive world-model experiments for hidden-objective discovery and planning"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle-core/cudnn", "candle-nn/cudnn"]
metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
anyhow = "1.0"
candle-core = "0.11.0"
candle-nn = "0.11.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
