[package]
name = "jepa_ai"
version = "0.1.0"
edition = "2021"

[features]
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rand = "0.10.1"
rayon = "1.12.0"
candle-core = { version = "0.10.2", default-features = false }
candle-nn = { version = "0.10.2", default-features = false }
hf-hub = "0.5.0"
parquet = "59.0.0"
# OpenAI-compatible HTTP server (--serve)
axum = { version = "0.8.9", features = ["json"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync"] }
tokio-stream = "0.1.18"
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
regex = "1.12.4"
sha2 = "0.11.0"
md5 = "0.8.0"
# TensorBoard logging (local: writes to runs/, view with tensorboard --logdir runs/)
tensorboard-rs = "0.5.9"
